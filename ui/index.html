<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Redirect - Traefik</title>
        <style>
            body {
                background-color: #f4f4f4;
                color: #161616;
                font-family: sans-serif;
            }
            a {
                color: #0090de;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <h1>Automatic redirection</h1>
        <p><a id="goto" href="#/settings/http-routes">Go to Settings &gt; HTTP routes &#x2192;</a></p>
        <script>
            // This page is embedded as an IFRAME by the cluster UI: the hash
            // must be changed on the top window, otherwise only the iframe
            // location is updated and the Vue router never sees it.
            function gotoHttpRoutes() {
                try {
                    window.top.location.hash = "#/settings/http-routes";
                } catch (e) {
                    // Cross-origin top window: nothing we can do from here
                }
            }

            document.getElementById("goto").addEventListener("click", function (ev) {
                ev.preventDefault();
                gotoHttpRoutes();
            });

            setTimeout(gotoHttpRoutes, 3000);
        </script>
    </body>
</html>
